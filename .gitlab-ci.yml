      run_cli "${LOG_FILE}" $CLI --type user --host "$USER_HOST" --port "$USER_PORT" --username "$EMAIL" --password "$PASS" command "Benchmark 16 100 search 'what are these documents about' on datasets '$DATASET'"
  artifacts:
    when: always
    paths:
      - infinity_cli_test.log
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: on_success

stop:infinity:
  stage: test-infinity
  needs:
    - test:sdk:infinity
    - test:web-api:infinity
    - test:http-api:infinity
    - test:cli:infinity
  when: always
  script:
    - |
      # Send SIGINT to ragflow_server.py to trigger coverage save
      PID=$(sudo docker exec ${RAGFLOW_CONTAINER} ps aux | grep "ragflow_server.py" | grep -v grep | awk '{print $2}' | head -n 1) || true
      if [ -n "$PID" ]; then
        echo "Sending SIGINT to ragflow_server.py (PID: $PID)..."
        sudo docker exec ${RAGFLOW_CONTAINER} kill -INT $PID || true
        sleep 10
      fi
      sudo docker compose -f docker/docker-compose.yml -p ${CI_PIPELINE_ID} stop || true

      # Generate coverage report
      if [ -f docker/ragflow-logs/.coverage ]; then
        cp docker/ragflow-logs/.coverage .coverage
        source .venv/bin/activate
        echo "[paths]" > .coveragerc
        echo "source =" >> .coveragerc
        echo "    ." >> .coveragerc
        echo "    /ragflow" >> .coveragerc
        coverage xml -o coverage-infinity-server.xml
        rm .coveragerc
      fi

      # Collect logs
      if [ -d docker/ragflow-logs ]; then
        cp -r docker/ragflow-logs ${ARTIFACTS_DIR}/ragflow-logs-infinity || true
        tail -n 200 docker/ragflow-logs/ragflow_server.log || true
      fi
      sudo rm -rf docker/ragflow-logs || true

      # Stop containers and cleanup
      sudo docker compose -f docker/docker-compose.yml -p ${CI_PIPELINE_ID} down -v || true
      sudo docker ps -a --filter "label=com.docker.compose.project=${CI_PIPELINE_ID}" -q | xargs -r sudo docker rm -f || true
      if [[ -n "${RAGFLOW_IMAGE}" ]]; then
        sudo docker rmi -f ${RAGFLOW_IMAGE} || true
      fi
  artifacts:
    when: always
    paths:
      - coverage-infinity-server.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage-infinity-server.xml
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: always

# ====================
# Release Pipeline
# ====================

release:prepare:
  stage: release
  script:
    - |
      if [[ -n "${CI_COMMIT_TAG}" ]]; then
        RELEASE_TAG=${CI_COMMIT_TAG}
        if [[ ${RELEASE_TAG} == v* ]]; then
          PRERELEASE=false
        else
          PRERELEASE=true
        fi
        echo "Workflow triggered by tag: ${RELEASE_TAG}"
      elif [[ "${CI_PIPELINE_SOURCE}" == "schedule" ]]; then
        RELEASE_TAG=nightly
        PRERELEASE=true
        echo "Workflow triggered by schedule"
      else
        echo "Not a release pipeline"
        exit 0
      fi
      echo "RELEASE_TAG=${RELEASE_TAG}" >> release.env
      echo "PRERELEASE=${PRERELEASE}" >> release.env
      RELEASE_DATETIME=$(date --rfc-3339=seconds)
      echo "Release ${RELEASE_TAG} created from ${CI_COMMIT_SHA} at ${RELEASE_DATETIME}" > release_body.md
  artifacts:
    paths:
      - release_body.md
    reports:
      dotenv: release.env
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

release:docker:
  stage: release
  needs:
    - release:prepare
  script:
    - |
      echo "${DOCKERHUB_TOKEN}" | sudo docker login --username infiniflow --password-stdin
      sudo docker build \
        --build-arg NEED_MIRROR=1 \
        --build-arg HTTPS_PROXY=${HTTPS_PROXY} \
        --build-arg HTTP_PROXY=${HTTP_PROXY} \
        -t infiniflow/ragflow:${RELEASE_TAG} \
        -f Dockerfile .
      sudo docker tag infiniflow/ragflow:${RELEASE_TAG} infiniflow/ragflow:latest
      sudo docker push infiniflow/ragflow:${RELEASE_TAG}
      sudo docker push infiniflow/ragflow:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

release:sdk:
  stage: release
  needs:
    - release:prepare
  script:
    - cd sdk/python && uv build && uv publish --token ${PYPI_API_TOKEN}
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'

release:cli:
  stage: release
  needs:
    - release:prepare
  script:
    - cd admin/client && uv build && uv publish --token ${PYPI_API_TOKEN}
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'

release:gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - release:prepare
  script:
    - echo "Creating GitLab release for ${RELEASE_TAG}"
  release:
    tag_name: ${RELEASE_TAG}
    description: release_body.md
    ref: ${CI_COMMIT_SHA}
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
