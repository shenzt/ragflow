# GitLab CI/CD configuration for RAGFlow
# Converted from GitHub Actions workflows

stages:
  - lint
  - unit-test
  - build
  - test-elasticsearch
  - test-infinity
  - release

variables:
  RAGFLOW_IMAGE: infiniflow/ragflow:${CI_PIPELINE_ID}
  RAGFLOW_CONTAINER: ${CI_PIPELINE_ID}-ragflow-cpu-1
  ARTIFACTS_DIR: ${CI_PROJECT_DIR}/artifacts

# Default configuration
default:
  tags:
    - ragflow-test
  before_script:
    - echo "Pipeline triggered by ${CI_PIPELINE_SOURCE}"

# ====================
# Workflow rules
# ====================
workflow:
  rules:
    # Run on pushes to main branch
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - "**/*"
        - "!docs/**/*"
        - "!*.md"
        - "!*.mdx"
    # Run on version branches
    - if: '$CI_COMMIT_BRANCH =~ /^\d+\.\d+\.\d+$/'
    # Run on merge requests (non-draft with 'ci' label)
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /ci/'
    # Run on schedule
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    # Run on tags for release
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'

# ====================
# Tests Pipeline
# ====================

# Static code analysis with Ruff
lint:ruff:
  stage: lint
  image: python:3.12
  script:
    - pip install "ruff>=0.11"
    - ruff check
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: on_success

# Unit tests
unit-test:
  stage: unit-test
  script:
    - uv sync --python 3.12 --group test --frozen
    - source .venv/bin/activate
    - which pytest || echo "pytest not in PATH"
    - echo "Start to run unit test"
    - python3 run_tests.py
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: on_success

# Build Docker image
build:ragflow:
  stage: build
  script:
    - |
      RUNNER_WORKSPACE_PREFIX=${RUNNER_WORKSPACE_PREFIX:-${HOME}}
      sudo docker pull ubuntu:22.04
      sudo DOCKER_BUILDKIT=1 docker build \
        --build-arg NEED_MIRROR=1 \
        --build-arg HTTPS_PROXY=${HTTPS_PROXY} \
        --build-arg HTTP_PROXY=${HTTP_PROXY} \
        -f Dockerfile \
        -t ${RAGFLOW_IMAGE} .
    - |
      if [[ "${CI_PIPELINE_SOURCE}" == "schedule" ]]; then
        echo "HTTP_API_TEST_LEVEL=p3" >> build.env
      else
        echo "HTTP_API_TEST_LEVEL=p2" >> build.env
      fi
      echo "RAGFLOW_IMAGE=${RAGFLOW_IMAGE}" >> build.env
      echo "RAGFLOW_CONTAINER=${RAGFLOW_CONTAINER}" >> build.env
  artifacts:
    reports:
      dotenv: build.env
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: on_success

# ====================
# Elasticsearch Tests
# ====================

.es_test_template: &es_test_template
  stage: test-elasticsearch
  needs:
    - build:ragflow
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: on_success

start:elasticsearch:
  <<: *es_test_template
  script:
    - |
      # Compute port numbers
      RUNNER_NUM=${CI_RUNNER_ID:-1}
      ES_PORT=$((1200 + RUNNER_NUM * 10))
      OS_PORT=$((1201 + RUNNER_NUM * 10))
      INFINITY_THRIFT_PORT=$((23817 + RUNNER_NUM * 10))
      INFINITY_HTTP_PORT=$((23820 + RUNNER_NUM * 10))
      INFINITY_PSQL_PORT=$((5432 + RUNNER_NUM * 10))
      EXPOSE_MYSQL_PORT=$((5455 + RUNNER_NUM * 10))
      MINIO_PORT=$((9000 + RUNNER_NUM * 10))
      MINIO_CONSOLE_PORT=$((9001 + RUNNER_NUM * 10))
      REDIS_PORT=$((6379 + RUNNER_NUM * 10))
      TEI_PORT=$((6380 + RUNNER_NUM * 10))
      KIBANA_PORT=$((6601 + RUNNER_NUM * 10))
      SVR_HTTP_PORT=$((9380 + RUNNER_NUM * 10))
      ADMIN_SVR_HTTP_PORT=$((9381 + RUNNER_NUM * 10))
      SVR_MCP_PORT=$((9382 + RUNNER_NUM * 10))
      SANDBOX_EXECUTOR_MANAGER_PORT=$((9385 + RUNNER_NUM * 10))
      SVR_WEB_HTTP_PORT=$((80 + RUNNER_NUM * 10))
      SVR_WEB_HTTPS_PORT=$((443 + RUNNER_NUM * 10))

      # Write ports to docker/.env
      cat >> docker/.env <<EOF
      ES_PORT=${ES_PORT}
      OS_PORT=${OS_PORT}
      INFINITY_THRIFT_PORT=${INFINITY_THRIFT_PORT}
      INFINITY_HTTP_PORT=${INFINITY_HTTP_PORT}
      INFINITY_PSQL_PORT=${INFINITY_PSQL_PORT}
      EXPOSE_MYSQL_PORT=${EXPOSE_MYSQL_PORT}
      MINIO_PORT=${MINIO_PORT}
      MINIO_CONSOLE_PORT=${MINIO_CONSOLE_PORT}
      REDIS_PORT=${REDIS_PORT}
      TEI_PORT=${TEI_PORT}
      KIBANA_PORT=${KIBANA_PORT}
      SVR_HTTP_PORT=${SVR_HTTP_PORT}
      ADMIN_SVR_HTTP_PORT=${ADMIN_SVR_HTTP_PORT}
      SVR_MCP_PORT=${SVR_MCP_PORT}
      SANDBOX_EXECUTOR_MANAGER_PORT=${SANDBOX_EXECUTOR_MANAGER_PORT}
      SVR_WEB_HTTP_PORT=${SVR_WEB_HTTP_PORT}
      SVR_WEB_HTTPS_PORT=${SVR_WEB_HTTPS_PORT}
      COMPOSE_PROFILES=\${COMPOSE_PROFILES},tei-cpu
      TEI_MODEL=BAAI/bge-small-en-v1.5
      RAGFLOW_IMAGE=${RAGFLOW_IMAGE}
      EOF

      echo "HOST_ADDRESS=http://host.docker.internal:${SVR_HTTP_PORT}" >> es.env
      echo "SVR_HTTP_PORT=${SVR_HTTP_PORT}" >> es.env
      echo "ADMIN_SVR_HTTP_PORT=${ADMIN_SVR_HTTP_PORT}" >> es.env

      # Patch entrypoint.sh for coverage
      sed -i '/"\$PY" api\/ragflow_server.py \${INIT_SUPERUSER_ARGS} &/c\   echo "Ensuring coverage is installed..."\n      "$PY" -m pip install coverage\n     export COVERAGE_FILE=/ragflow/logs/.coverage\n        echo "Starting ragflow_server with coverage..."\n        "$PY" -m coverage run --source=./api/apps --omit="*/tests/*,*/migrations/*" -a api/ragflow_server.py ${INIT_SUPERUSER_ARGS} &' docker/entrypoint.sh

      sudo docker compose -f docker/docker-compose.yml -p ${CI_PIPELINE_ID} up -d
      uv sync --python 3.12 --group test --frozen && uv pip install -e sdk/python
  artifacts:
    reports:
      dotenv: es.env

test:sdk:elasticsearch:
  stage: test-elasticsearch
  needs:
    - start:elasticsearch
    - build:ragflow
  script:
    - |
      export http_proxy="" https_proxy="" no_proxy="" HTTP_PROXY="" HTTPS_PROXY="" NO_PROXY=""
      until sudo docker exec ${RAGFLOW_CONTAINER} curl -s --connect-timeout 5 ${HOST_ADDRESS}/v1/system/ping > /dev/null; do
        echo "Waiting for service to be available..."
        sleep 5
      done
      source .venv/bin/activate
      set -o pipefail
      pytest -s --tb=short --level=${HTTP_API_TEST_LEVEL} \
        --junitxml=pytest-es-sdk.xml \
        --cov=sdk/python/ragflow_sdk \
        --cov-branch \
        --cov-report=xml:coverage-es-sdk.xml \
        test/testcases/test_sdk_api 2>&1 | tee es_sdk_test.log
  artifacts:
    when: always
    paths:
      - es_sdk_test.log
      - pytest-es-sdk.xml
      - coverage-es-sdk.xml
    reports:
      junit: pytest-es-sdk.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage-es-sdk.xml
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: on_success

